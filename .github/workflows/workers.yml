name: Deploy Workers

on:
    workflow_call:

jobs:
    deploy-workers:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Push to workers branch
              run: |
                  git config user.name "github-actions"
                  git config user.email "actions@github.com"

                  git fetch origin workers || true
                  git checkout -B workers

                  git push origin workers --force
