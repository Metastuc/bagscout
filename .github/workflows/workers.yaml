name: Deploy Workers

on:
    push:
        branches: [main]

jobs:
    deploy-workers:
        runs-on: ubuntu-latest

        if: contains(github.event.head_commit.message, '[deploy-workers]')

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Push to workers branch
              run: |
                  git config user.name "github-actions"
                  git config user.email "actions@github.com"

                  git fetch origin workers || true
                  git checkout -B workers

                  git push origin workers --force
